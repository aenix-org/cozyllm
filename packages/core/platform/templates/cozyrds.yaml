            "default": "openai/gpt-4o"
          },
          "openaiBaseUrl": {
            "description": "OpenAI-compatible API endpoint. Point this at an in-cluster LiteLLM gateway (e.g. http://litellm-\u003crelease\u003e.cozy-litellm.svc.cluster.local:4000/v1) to keep all SRE-related LLM calls inside the cluster. Empty falls back to the public OpenAI API.",
            "type": "string",
            "default": ""
          },
          "openaiApiKey": {
            "description": "Bearer token for the API endpoint. For LiteLLM, this is the master key. Stored as a Kubernetes Secret.",
            "type": "string",
            "default": ""
          },
          "replicaCount": {
            "description": "Number of HolmesGPT pods.",
            "type": "integer",
            "default": 1
          }
        }
