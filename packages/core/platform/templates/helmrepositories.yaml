# No external HelmRepositories required.
# vllm-inference chart is sourced directly from the cozyllm GitRepository.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jupyterhub
  namespace: external-jupyterhub
spec:
  interval: 5m
  url: https://jupyterhub.github.io/helm-chart/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langflow
  namespace: external-langflow
spec:
  interval: 5m
  url: https://langflow-ai.github.io/langflow-helm-charts/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: n8n
  namespace: external-n8n
spec:
  interval: 5m
  type: oci
  url: oci://8gears.container-registry.com/library
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: external-open-webui
spec:
  interval: 5m
  url: https://helm.openwebui.com/
---
# oauth2-proxy — OIDC gatekeeper deployed in front of the ComputePlane workload of
# every gated app (langflow / open-webui / jupyterhub / comfyui).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oauth2-proxy
  namespace: external-oauth2-proxy
spec:
  interval: 5m
  url: https://oauth2-proxy.github.io/manifests
