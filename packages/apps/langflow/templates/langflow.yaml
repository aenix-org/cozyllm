apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # cozystack already creates an outer HelmRelease named `{{ .Release.Name }}` from
  # the ApplicationDefinition; the wrapping HelmRelease we render here must have a
  # different name to avoid the "patch a resource with different ownership" failure.
  name: {{ .Release.Name }}-app
spec:
  interval: 5m
  chart:
    spec:
      chart: langflow-ide
      # renovate: datasource=helm depName=langflow-ide registryUrl=https://langflow-ai.github.io/langflow-helm-charts/
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: langflow
        namespace: external-langflow
  dependsOn:
    - name: postgres-{{ .Release.Name }}-db
      namespace: {{ .Release.Namespace }}
  values:
    # Bundled postgresql subchart is replaced with the cozystack-managed Postgres
    # provisioned via the Pattern C sibling CR in templates/postgres.yaml.
    postgresql:
      enabled: false
    langflow:
      backend:
        externalDatabase:
          enabled: true
          driver:
            value: "postgresql"
          host:
            value: "postgres-{{ .Release.Name }}-db-rw"
          port:
            value: "5432"
          user:
            value: "{{ .Values.database.user }}"
          password:
            valueFrom:
              secretKeyRef:
                name: "postgres-{{ .Release.Name }}-db-credentials"
                key: "{{ .Values.database.user }}"
          database:
            value: "{{ .Values.database.name }}"
    {{- if .Values.host }}
    ingress:
      enabled: true
      hosts:
        - host: {{ .Values.host | quote }}
          paths:
            - path: /
              pathType: Prefix
    {{- end }}
