{{- /*
  Self-contained ComputePlane app.

  The bundled Postgres is a single private dependency (website#594): a raw CNPG
  Cluster deployed as part of this release on the MANAGEMENT cluster, hidden from
  the user. Only the untrusted-code n8n workload is routed onto the tenant's
  ComputePlane via the Kamaji-written admin kubeconfig. The workload reaches the
  management Postgres by DNS — `postgres-<release>-db-rw` resolves through the
  ComputePlane pods' `*.svc.cozy.local` search domain back to the tenant namespace
  on management.

  The DB password is never the user's concern: the chart generates it (look up the
  existing credentials Secret -> reuse, else randAlphaNum) so it survives reconciles,
  and writes the SAME value into the CNPG bootstrap secret on management AND into the
  workload values on the ComputePlane. Password is computed once here so both sides
  always match.
*/}}
{{- $db := printf "postgres-%s-db" .Release.Name }}
{{- $secret := printf "%s-app" $db }}
{{- $pw := .Values.database.password }}
{{- if not $pw }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
  {{- if and $existing $existing.data (hasKey $existing.data "password") }}
    {{- $pw = index $existing.data "password" | b64dec }}
  {{- else }}
    {{- $pw = randAlphaNum 24 }}
  {{- end }}
{{- end }}
---
# Bundled Postgres credentials (management). Generated by the chart, hidden from the user.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ $pw | quote }}
---
# Bundled raw CNPG Postgres (management) — private dependency, not a first-class app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.database.replicas }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
  storage:
    size: {{ .Values.database.size }}
    {{- with .Values.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.user }}
      secret:
        name: {{ $secret }}
  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
---
# Untrusted-code n8n workload — routed onto the tenant's ComputePlane.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # cozystack already creates an outer HelmRelease named `{{ .Release.Name }}` from
  # the ApplicationDefinition; the wrapping HelmRelease we render here must have a
  # different name to avoid the "patch a resource with different ownership" failure.
  name: {{ .Release.Name }}-app
spec:
  interval: 5m
  kubeConfig:
    secretRef:
      name: computeplane-admin-kubeconfig
      key: super-admin.svc
  install:
    createNamespace: true
  chart:
    spec:
      chart: n8n
      # renovate: datasource=docker depName=8gears.container-registry.com/library/n8n
      version: 2.0.1
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: external-n8n
  values:
    # Bundled Valkey is disabled — single-process mode without queue workers.
    valkey:
      enabled: false
    main:
      {{- if and .Values.resources (or .Values.resources.cpu .Values.resources.memory) }}
      resources:
        requests:
          {{- with .Values.resources.cpu }}
          cpu: {{ . | quote }}
          {{- end }}
          {{- with .Values.resources.memory }}
          memory: {{ . | quote }}
          {{- end }}
        limits:
          {{- with .Values.resources.cpu }}
          cpu: {{ . | quote }}
          {{- end }}
          {{- with .Values.resources.memory }}
          memory: {{ . | quote }}
          {{- end }}
      {{- end }}
      config:
        db:
          type: postgresdb
          postgresdb:
            # resolves via the ComputePlane pods' *.svc.cozy.local search domain to
            # the management cluster's tenant namespace
            host: {{ $db }}-rw
            port: 5432
            database: {{ .Values.database.name }}
            user: {{ .Values.database.user }}
      extraEnv:
        # Same generated password as the management Postgres (no cross-cluster secret sync).
        DB_POSTGRESDB_PASSWORD: {{ $pw | quote }}
        {{- if .Values.host }}
        # Behind the TLS Ingress: n8n needs its public URL so generated
        # webhook/editor links and OAuth callbacks are correct.
        N8N_HOST: {{ .Values.host | quote }}
        N8N_PROTOCOL: "https"
        N8N_SECURE_COOKIE: "true"
        WEBHOOK_URL: {{ printf "https://%s/" .Values.host | quote }}
        {{- end }}
      {{- with .Values.encryptionKey }}
      secret:
        n8n:
          encryption_key: {{ . | quote }}
      {{- end }}
    {{- if .Values.host }}
    {{- $cluster := .Values._cluster | default dict }}
    {{- $solver := index $cluster "solver" | default "http01" }}
    {{- $clusterIssuer := index $cluster "issuer-name" | default "letsencrypt-prod" }}
    ingress:
      enabled: true
      # the ComputePlane's own ingress-nginx (the addon's IngressClass), exposed back
      # to the tenant entry point via a per-app management Ingress (see below)
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: {{ $clusterIssuer }}
        {{- if eq $solver "http01" }}
        acme.cert-manager.io/http01-ingress-ingressclassname: nginx
        {{- end }}
      hosts:
        - host: {{ .Values.host | quote }}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - {{ .Values.host | quote }}
          secretName: {{ .Release.Name }}-n8n-tls
    {{- end }}
{{- if .Values.host }}
{{- $ingressClass := index (.Values._cluster | default dict) "expose-ingress" | default "tenant-root" }}
---
# Per-app exposure: a management Ingress proxies the app's host to the ComputePlane's
# ingress-nginx (the `computeplane-ingress-nginx` Service selects the ComputePlane VM
# nodes via NodePort, ssl-passthrough). No management LoadBalancer is allocated; the
# app is reachable through the tenant's normal entry point.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-computeplane
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: {{ $ingressClass }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: computeplane-ingress-nginx
                port:
                  number: 443
{{- end }}
