apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}
spec:
  interval: 5m
  chart:
    spec:
      chart: holmes
      # renovate: datasource=helm depName=holmes registryUrl=https://robusta-charts.storage.googleapis.com
      version: 0.30.1
      sourceRef:
        kind: HelmRepository
        name: holmes
        namespace: external-holmesgpt
  values:
    replicas: {{ .Values.replicaCount }}
    additionalEnvVars:
      - name: MODEL
        value: {{ .Values.model | quote }}
      {{- with .Values.openaiBaseUrl }}
      - name: OPENAI_BASE_URL
        value: {{ . | quote }}
      {{- end }}
      {{- if .Values.openaiApiKey }}
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: {{ .Release.Name }}-llm-key
            key: api-key
      {{- end }}
