apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # cozystack already creates an outer HelmRelease named `{{ .Release.Name }}` from
  # the ApplicationDefinition; the wrapping HelmRelease we render here must have a
  # different name to avoid the "patch a resource with different ownership" failure.
  name: {{ .Release.Name }}-app
spec:
  interval: 5m
  chart:
    spec:
      chart: jupyterhub
      # renovate: datasource=helm depName=jupyterhub registryUrl=https://jupyterhub.github.io/helm-chart/
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: jupyterhub
        namespace: external-jupyterhub
  dependsOn:
    - name: postgres-{{ .Release.Name }}-db
      namespace: {{ .Release.Namespace }}
  values:
    # Multi-tenancy: the dedicated user-scheduler ships a cluster-scoped
    # ClusterRole + ClusterRoleBinding (a copy of system:kube-scheduler) that
    # would let any tenant read pods/nodes cluster-wide and collide on a
    # fixed cluster-scoped name. Disable it so the hub uses the default
    # kube-scheduler and emits only namespaced RBAC.
    scheduling:
      userScheduler:
        enabled: false
    {{- if or .Values.resources.cpu .Values.resources.memory }}
    singleuser:
      {{- with .Values.resources.cpu }}
      cpu:
        limit: {{ . }}
        guarantee: {{ . }}
      {{- end }}
      {{- with .Values.resources.memory }}
      memory:
        limit: {{ . | quote }}
        guarantee: {{ . | quote }}
      {{- end }}
    {{- end }}
    hub:
      db:
        type: postgres
        url: postgresql://{{ .Values.database.user }}@postgres-{{ .Release.Name }}-db-rw:5432/{{ .Values.database.name }}
    # Exposure (Ingress) is handled by the OIDC gatekeeper (templates/
    # gatekeeper.yaml), never by z2jh directly — so the hub is never reachable
    # from outside the cluster without authenticating through Keycloak.
    ingress:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: postgres-{{ .Release.Name }}-db-credentials
      valuesKey: {{ .Values.database.user }}
      targetPath: hub.db.password
