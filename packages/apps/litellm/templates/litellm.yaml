{{- /*
  Self-contained ComputePlane app (see the n8n app for the reference pattern).

  The bundled Postgres is a raw CNPG Cluster on the MANAGEMENT cluster (website#594:
  a private dependency bundled inside the release, hidden from the user). Only the
  untrusted LiteLLM workload is routed onto the tenant's ComputePlane; it reaches the
  management Postgres by DNS. The DB password and the LiteLLM master key are generated
  once here (lookup existing -> reuse, else randAlphaNum) so they survive restarts and
  are passed into the workload as plain values — the workload pod on the ComputePlane
  cannot read a management Secret, so a secretKeyRef would break cross-cluster.

  The workload is the upstream litellm-helm chart, vendored + patched under
  packages/system/litellm-helm (the patch adds value-based DB credentials, which the
  upstream chart only supports via a same-cluster secret). It is referenced through the
  cozyllm GitRepository (HelmChart cozyllm-litellm-helm in helmcharts.yaml).
*/}}
{{- $db := printf "postgres-%s-db" .Release.Name }}
{{- $secret := printf "%s-app" $db }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{ $data = $existing.data }}{{ end }}
{{- $pw := .Values.postgres.password }}
{{- if not $pw }}
  {{- if hasKey $data "password" }}{{ $pw = index $data "password" | b64dec }}{{ else }}{{ $pw = randAlphaNum 24 }}{{ end }}
{{- end }}
{{- $masterKey := .Values.masterKey }}
{{- if not $masterKey }}
  {{- if hasKey $data "master-key" }}{{ $masterKey = index $data "master-key" | b64dec }}{{ else }}{{ $masterKey = printf "sk-%s" (randAlphaNum 32) }}{{ end }}
{{- end }}
{{- $cluster := .Values._cluster | default dict }}
{{- $solver := index $cluster "solver" | default "http01" }}
{{- $clusterIssuer := index $cluster "issuer-name" | default "letsencrypt-prod" }}
{{- $ingressClass := index $cluster "expose-ingress" | default "tenant-root" }}
---
# Bundled Postgres credentials + LiteLLM master key (management). Generated by the chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $pw | quote }}
  master-key: {{ $masterKey | quote }}
---
# Bundled raw CNPG Postgres (management) — private dependency, not a first-class app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.postgres.replicas }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie
  storage:
    size: {{ .Values.postgres.size }}
    {{- with .Values.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.name }}
      owner: {{ .Values.postgres.user }}
      secret:
        name: {{ $secret }}
  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
---
# Untrusted LiteLLM workload — routed onto the tenant's ComputePlane, on the vendored +
# patched upstream litellm-helm chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-app
spec:
  interval: 5m
  kubeConfig:
    secretRef:
      name: computeplane-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: {{ .Release.Namespace }}
  storageNamespace: {{ .Release.Namespace }}
  install:
    createNamespace: true
  chartRef:
    kind: HelmChart
    name: cozyllm-litellm-helm
    namespace: cozy-public
  values:
    # The litellm-database image runs prisma migrations on startup, so the chart's
    # separate migration Job (which sources the DB via a same-cluster secretKeyRef) is
    # not needed and would not work cross-cluster.
    image:
      repository: ghcr.io/berriai/litellm-database
    migrationJob:
      enabled: false
    masterkeySecretName: ""
    # DB: point at the bundled management CNPG by DNS; pass credentials as values (the
    # patched chart supports db.username/db.password without a same-cluster secret).
    db:
      deployStandalone: false
      useExisting: true
      endpoint: {{ $db }}-rw
      database: {{ .Values.postgres.name | quote }}
      username: {{ .Values.postgres.user | quote }}
      password: {{ $pw | quote }}
    {{- if and .Values.resources (or .Values.resources.cpu .Values.resources.memory) }}
    resources:
      requests:
        {{- with .Values.resources.cpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with .Values.resources.memory }}
        memory: {{ . | quote }}
        {{- end }}
      limits:
        {{- with .Values.resources.memory }}
        memory: {{ . | quote }}
        {{- end }}
    {{- end }}
    extraEnvVars:
      # Same generated master key as stored in the credentials secret; passed as a value
      # so no management secret needs to exist on the ComputePlane.
      - name: LITELLM_MASTER_KEY
        value: {{ $masterKey | quote }}
    proxy_config:
      model_list:
        {{- range .Values.models }}
        - model_name: {{ .name | quote }}
          litellm_params:
            model: {{ printf "openai/%s" .name | quote }}
            api_base: {{ .url | quote }}
            api_key: {{ .apiKey | default "none" | quote }}
        {{- end }}
      general_settings:
        master_key: "os.environ/LITELLM_MASTER_KEY"
        database_url: "os.environ/DATABASE_URL"
      litellm_settings:
        request_timeout: 600
        drop_params: true
    {{- if .Values.host }}
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: {{ .Values.host }}
          paths:
            - path: /
              pathType: Prefix
      annotations:
        cert-manager.io/cluster-issuer: {{ $clusterIssuer }}
        {{- if eq $solver "http01" }}
        acme.cert-manager.io/http01-ingress-ingressclassname: nginx
        {{- end }}
      tls:
        - hosts:
            - {{ .Values.host }}
          secretName: {{ .Release.Name }}-tls
    {{- end }}
{{- if .Values.host }}
---
# Per-app exposure: management Ingress proxies the app host to the ComputePlane
# ingress-nginx (ssl-passthrough) — no management LoadBalancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-computeplane
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: {{ $ingressClass }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: computeplane-ingress-nginx
                port:
                  number: 443
{{- end }}
