apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm-inference.fullname" . }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
    cozyllm.io/model: "true"
    cozyllm.io/model-name: {{ .Values.model | replace "/" "-" | lower | trunc 63 | trimSuffix "-" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vllm-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm-inference.selectorLabels" . | nindent 8 }}
        cozyllm.io/model: "true"
    spec:
      {{- if .Values.gpuEnabled }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: vllm
          image: "vllm/vllm-openai:v{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - {{ .Values.model | quote }}
            - "--tensor-parallel-size"
            - {{ .Values.gpuCount | quote }}
            - "--max-model-len"
            - {{ .Values.maxContextLength | quote }}
            - "--served-model-name"
            - {{ .Values.model | quote }}
            - "--download-dir"
            - "/data/hf_cache"
            {{- if ne .Values.quantization "fp16" }}
            - "--quantization"
            - {{ .Values.quantization | quote }}
            {{- end }}
            {{- if .Values.apiKey }}
            - "--api-key"
            - "$(VLLM_API_KEY)"
            {{- end }}
          env:
            - name: HF_HOME
              value: /data/hf_cache
            {{- if .Values.huggingfaceToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vllm-inference.fullname" . }}-hf-token
                  key: token
            {{- end }}
            {{- if .Values.apiKey }}
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vllm-inference.fullname" . }}-api-key
                  key: key
            {{- end }}
            {{- if .Values.modelCache.s3.enabled }}
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: bucket-{{ include "vllm-inference.fullname" . }}-models-credentials
                  key: endpoint
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bucket-{{ include "vllm-inference.fullname" . }}-models-credentials
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bucket-{{ include "vllm-inference.fullname" . }}-models-credentials
                  key: secretKey
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # No readiness probe — vLLM downloads model on startup (10-30 min).
          # Helm install would timeout waiting for readiness. The pod is
          # available once Running; /health returns 503 until model loads.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: {{ default "4" .Values.resources.cpu | quote }}
              memory: {{ default "16Gi" .Values.resources.memory | quote }}
              {{- if .Values.gpuEnabled }}
              nvidia.com/gpu: {{ .Values.gpuCount }}
              {{- end }}
            limits:
              cpu: {{ default "4" .Values.resources.cpu | quote }}
              memory: {{ default "16Gi" .Values.resources.memory | quote }}
              {{- if .Values.gpuEnabled }}
              nvidia.com/gpu: {{ .Values.gpuCount }}
              {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /data
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "vllm-inference.fullname" . }}-model-cache
